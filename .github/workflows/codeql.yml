name: CodeQL

# Code scanning defined here rather than through GitHub's "default setup", so it is versioned with the repository and
# survives a move or a re-creation. The default setup must stay off (build/policy/code-scanning.json): GitHub rejects
# uploads from a workflow while it is on.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Weekly, so a newly published query finds old code too.
    - cron: "23 4 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        # "actions" analyses the workflow files themselves (script injection, unpinned or over-privileged steps).
        language: [csharp, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          # No build needed: C# is analysed from source.
          build-mode: none

      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: "/language:${{ matrix.language }}"
