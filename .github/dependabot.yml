version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
    groups:
      microsoft:
        patterns: ["Microsoft.*", "System.*"]
      testing:
        patterns: ["NUnit*", "coverlet.*", "Microsoft.NET.Test.Sdk"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
