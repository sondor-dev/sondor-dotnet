name: Feature request
description: Suggest an addition or a change
labels: [enhancement]
body:
  - type: input
    id: package
    attributes:
      label: Package
      placeholder: Sondor.Cqrs
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: The problem first, then the change you have in mind.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried or considered?
